name: Update Lucknow data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh data.json
        run: python scripts/update.py

      - name: Commit if changed
        run: |
          git config user.name "lucknow-auto-updater"
          git config user.email "actions@users.noreply.github.com"
          git add data.json leads.json
          git commit -m "auto: refresh data" || echo "no changes"
          git push
